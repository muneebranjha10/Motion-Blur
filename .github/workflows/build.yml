name: Build MotionGlass Lab from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'OneUI-MotionGlass-Lab-v0.1-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract source ZIP
        run: |
          test -f OneUI-MotionGlass-Lab-v0.1-source.zip
          mkdir -p project
          unzip -q OneUI-MotionGlass-Lab-v0.1-source.zip -d project
          test -f project/app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile MotionGlass Lab APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionGlass-Lab-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
